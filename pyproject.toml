[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "pyteleflow"

[project]
name = "pyteleflow"
version = "0.1.0"
description = "Asynchronous framework for building Telegram bots with linear flows"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nebenwelt" }]
keywords = ["telegram", "bot", "async", "python-telegram-bot", "conversation", "flow"]
readme = "README.md"
requires-python = ">=3.12"

classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: AsyncIO",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = [
    "python-telegram-bot[rate-limiter]>=22.8",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
log_cli = false
log_cli_level = "DEBUG"
